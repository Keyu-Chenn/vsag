<script>
const DATA = JSON.parse(document.getElementById("plot-data").textContent);
DATA.methodColors.uhg = "#4B5563";
DATA.methodLabels.uhgs = "UHGS";
DATA.methodLabels.uhgh = "UHGH";
const SVG_NS = "http://www.w3.org/2000/svg";

function node(name, attrs = {}, text = null) {
  const element = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) {
    element.setAttribute(key, value);
  }
  if (text !== null) element.textContent = text;
  return element;
}

function efValue(point) {
  return Number(point.param.split("=").pop());
}

function yScale(value, minValue, maxValue, plotTop, plotHeight) {
  return plotTop + (maxValue - value) / (maxValue - minValue) * plotHeight;
}

function recallBounds(values) {
  const lowerValue = Math.min(...values);
  const upperValue = Math.max(...values);
  const difference = Math.max(upperValue - lowerValue, 0.1);
  const rawStep = difference / 4;
  const power = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const scaled = rawStep / power;
  const step = (scaled <= 1.5 ? 1 : scaled <= 3.5 ? 2 : scaled <= 7 ? 5 : 10) * power;
  const min = Math.max(0, Math.floor((lowerValue - difference * 0.2) / step) * step);
  const max = Math.min(100, Math.ceil((upperValue + difference * 0.35) / step) * step);
  const ticks = [];
  for (let tick = min; tick <= max + step * 0.5; tick += step) {
    ticks.push(Number(tick.toFixed(8)));
  }
  return { min, max, ticks };
}

function comparisonMethod(alpha) {
  return alpha === "0.3" ? "uhgs" : "uhgh";
}

function drawMarker(svg, type, x, y, color, size = 5.5) {
  if (type === "square") {
    svg.appendChild(node("rect", {
      x: x - size / 2,
      y: y - size / 2,
      width: size,
      height: size,
      fill: color,
      stroke: "#111111",
      "stroke-width": 0.5,
    }));
  } else if (type === "triangle") {
    const points = [
      `${x},${y - size / 2}`,
      `${x - size / 2},${y + size / 2}`,
      `${x + size / 2},${y + size / 2}`,
    ].join(" ");
    svg.appendChild(node("polygon", {
      points,
      fill: color,
      stroke: "#111111",
      "stroke-width": 0.5,
    }));
  } else {
    const points = [];
    for (let i = 0; i < 5; i++) {
      const angle = -Math.PI / 2 + (2 * Math.PI * i) / 5;
      points.push(`${x + Math.cos(angle) * size / 2},${y + Math.sin(angle) * size / 2}`);
    }
    svg.appendChild(node("polygon", {
      points: points.join(" "),
      fill: color,
      stroke: "#111111",
      "stroke-width": 0.5,
    }));
  }
}

function drawLegend(svg, width) {
  const y = 52;
  const methods = DATA.methods;
  const labelWidths = { uhg: 58, uhgs: 74, uhgh: 76 };
  const gap = 36;
  const itemWidths = methods.map((method) => 29 + labelWidths[method]);
  const totalWidth = itemWidths.reduce((sum, value) => sum + value, 0) + gap * (methods.length - 1);
  let x = width / 2 - totalWidth / 2;

  methods.forEach((method, index) => {
    const color = DATA.methodColors[method];
    drawMarker(svg, DATA.methodMarkers[method], x + 9, y - 4, color, 12);
    svg.appendChild(node("text", {
      x: x + 28,
      y: y,
      class: "legend",
    }, DATA.methodLabels[method]));
    x += itemWidths[index] + gap;
  });
}

function matchedPoint(dataset, alpha, method) {
  return DATA.points[dataset][alpha][method]
    .find((point) => String(efValue(point)) === String(DATA.targetEf));
}

function drawRow(svg, alpha, rowIndex, panelX, panelY, panelWidth) {
  const improvedMethod = comparisonMethod(alpha);
  const groups = DATA.datasets.map((dataset) => ({
    dataset,
    baseline: matchedPoint(dataset, alpha, "uhg"),
    improved: matchedPoint(dataset, alpha, improvedMethod),
  })).filter((group) => group.baseline && group.improved);
  const values = groups.flatMap((group) => [
    group.baseline.recall * 100,
    group.improved.recall * 100,
  ]);
  const bounds = recallBounds(values);
  const plotLeft = panelX + 64;
  const plotTop = panelY + 13;
  const plotWidth = panelWidth - 82;
  const plotHeight = 285;
  const plotBottom = plotTop + plotHeight;

  svg.appendChild(node("rect", {
    x: plotLeft,
    y: plotTop,
    width: plotWidth,
    height: plotHeight,
    fill: "#ffffff",
    stroke: "#111111",
    "stroke-width": 1,
  }));

  bounds.ticks.forEach((tick) => {
    const y = yScale(tick, bounds.min, bounds.max, plotTop, plotHeight);
    svg.appendChild(node("line", {
      x1: plotLeft,
      y1: y,
      x2: plotLeft + plotWidth,
      y2: y,
      class: tick === bounds.min ? "baseline" : "grid-line",
    }));
    svg.appendChild(node("text", {
      x: plotLeft - 10,
      y: y + 4,
      "text-anchor": "end",
      class: "tick",
    }, Number.isInteger(tick) ? String(tick) : tick.toFixed(1)));
  });

  const groupWidth = plotWidth / groups.length;
  const barWidth = Math.min(72, groupWidth * 0.3);
  groups.forEach((group, groupIndex) => {
    const groupCenter = plotLeft + groupWidth * (groupIndex + 0.5);
    const bars = [
      {
        recall: group.baseline.recall * 100,
        method: "uhg",
        center: groupCenter - barWidth * 0.62,
      },
      {
        recall: group.improved.recall * 100,
        method: improvedMethod,
        center: groupCenter + barWidth * 0.62,
      },
    ];
    bars.forEach((bar) => {
      const y = yScale(bar.recall, bounds.min, bounds.max, plotTop, plotHeight);
      const barLeft = bar.center - barWidth / 2;
      svg.appendChild(node("rect", {
        x: barLeft,
        y,
        width: barWidth,
        height: plotBottom - y,
        fill: DATA.methodColors[bar.method],
        stroke: "#111111",
        "stroke-width": 0.7,
      }));
      svg.appendChild(node("text", {
        x: bar.center,
        y: y - 7,
        "text-anchor": "middle",
        class: "bar-value",
      }, bar.recall.toFixed(1)));
    });
    svg.appendChild(node("text", {
      x: groupCenter,
      y: plotBottom + 12,
      "text-anchor": "middle",
      "dominant-baseline": "hanging",
      class: "bar-label",
    }, DATA.datasetLabels[group.dataset]));
  });

  svg.appendChild(node("polyline", {
    points: `${plotLeft - 4},${plotBottom - 8} ${plotLeft + 4},${plotBottom - 4} ${plotLeft - 4},${plotBottom}`,
    fill: "none",
    stroke: "#111111",
    "stroke-width": 1.2,
  }));
  svg.appendChild(node("text", {
    x: panelX + 19,
    y: plotTop + plotHeight / 2,
    transform: `rotate(-90 ${panelX + 19} ${plotTop + plotHeight / 2})`,
    "text-anchor": "middle",
    class: "axis-label",
  }, "Recall (%)"));
  svg.appendChild(node("text", {
    x: plotLeft + plotWidth / 2,
    y: plotBottom + 61,
    "text-anchor": "middle",
    class: "panel-label",
  }, `(${String.fromCharCode(97 + rowIndex)}) α=${alpha} (ef_search=${DATA.targetEf})`));
}

function draw() {
  const svg = document.getElementById("figure");
  const width = 1480;
  const height = 480;
  const panelWidth = 700;
  const colGap = 40;
  const totalPanelWidth = panelWidth * DATA.alphas.length + colGap * (DATA.alphas.length - 1);
  const startX = (width - totalPanelWidth) / 2;
  const startY = 80;

  svg.replaceChildren();

  const defs = node("defs");
  const style = node("style");
  style.textContent = `
    .legend { font: 25px "Times New Roman", Times, serif; fill: #111111; }
    .tick { font: 21px "Times New Roman", Times, serif; fill: #111111; }
    .axis-label { font: 23px "Times New Roman", Times, serif; fill: #111111; }
    .panel-label { font: 25px "Times New Roman", Times, serif; fill: #111111; }
    .bar-label { font: 22px "Times New Roman", Times, serif; fill: #111111; }
    .bar-value { font: bold 23px "Times New Roman", Times, serif; fill: #111111; }
    .grid-line { stroke: #8f8f8f; stroke-width: 0.75; stroke-dasharray: 2 2; }
    .axis-grid-edge { stroke: #111111; stroke-width: 0.9; }
    .baseline { stroke: #111111; stroke-width: 1.1; }
  `;
  defs.appendChild(style);
  svg.appendChild(defs);

  svg.appendChild(node("title", { id: "figure-title" }, "Recall Improvement from Entry-Point Selection"));
  svg.appendChild(node("desc", { id: "figure-desc" }, "Recall comparison at a fixed, matched ef_search value."));
  svg.appendChild(node("rect", { x: 0, y: 0, width, height, fill: "#ffffff" }));

  drawLegend(svg, width);

  DATA.alphas.forEach((alpha, colIndex) => {
    drawRow(
      svg,
      alpha,
      colIndex,
      startX + colIndex * (panelWidth + colGap),
      startY,
      panelWidth
    );
  });
}

function downloadSvg() {
  const svg = document.getElementById("figure");
  const source = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "ablation_fig8.svg";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

draw();
</script>
