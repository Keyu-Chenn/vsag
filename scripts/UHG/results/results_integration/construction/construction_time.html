<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Time and Index Size</title>
<style>
:root {
  color-scheme: light;
  --ink: #111111;
  --page: #f5f5f5;
  --paper: #ffffff;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  background: var(--page);
  color: var(--ink);
  font-family: "Times New Roman", Times, serif;
}
.toolbar {
  width: min(1180px, 100%);
  margin: 0 auto 12px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
button {
  appearance: none;
  border: 1px solid #c7c7c7;
  border-radius: 4px;
  padding: 7px 12px;
  background: #ffffff;
  color: #111111;
  font: 14px "Times New Roman", Times, serif;
  cursor: pointer;
}
button:hover {
  background: #f7f7f7;
}
.page {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 10px;
  background: var(--paper);
  border: 1px solid #dddddd;
}
svg {
  display: block;
  width: 100%;
  height: auto;
}
@page {
  size: A4 landscape;
  margin: 0.2in;
}
@media print {
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }
  body {
    padding: 0;
    min-height: 0;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toolbar {
    display: none;
  }
  .page {
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    break-inside: avoid;
    page-break-inside: avoid;
    page-break-after: avoid;
  }
  svg {
    width: 100%;
    max-height: 7.6in;
  }
}
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" onclick="window.print()">Print PDF</button>
  <button type="button" onclick="downloadSvg()">Save SVG</button>
</div>
<main class="page" aria-label="Index size and construction time figure">
  <svg id="figure" viewBox="0 0 1180 470" role="img"
       aria-labelledby="figure-title figure-desc"></svg>
</main>
<script>
const DATA = {
  datasets: ["nq", "hotpotqa", "msmarco", "fever", "dbpedia-entity"],
  datasetLabels: {
    nq: "NQ",
    hotpotqa: "HotpotQA",
    msmarco: "MS MARCO",
    fever: "FEVER",
    "dbpedia-entity": "DBpedia-Entity",
  },
  methods: ["hnsw_sindi", "fhg", "uhg"],
  methodLabels: {
    hnsw_sindi: "HNSW+SINDI",
    fhg: "FHG",
    uhg: "UHG",
  },
  colors: {
    hnsw_sindi: "#7FA9D8",
    fhg: "#E6CF85",
    uhg: "#E89A9A",
  },
  time: {
    nq: {
      hnsw_sindi: 9829.32,
      uhg: 14855.00,
      fhg: 14342.70,
    },
    hotpotqa: {
      hnsw_sindi: 26641.90,
      uhg: 41439.20,
      fhg: 39278.90,
    },
    msmarco: {
      hnsw_sindi: 31685.90,
      uhg: 49395.20,
      fhg: 48278.20,
    },
    fever: {
      hnsw_sindi: 28768.80,
      uhg: 48869.30,
      fhg: 47232.00,
    },
    "dbpedia-entity": {
      hnsw_sindi: 23929.00,
      uhg: 36288.80,
      fhg: 35303.60,
    },
  },
  size: {
    nq: {
      hnsw_sindi: 14.29,
      uhg: 14.07,
      fhg: 12.25,
    },
    hotpotqa: {
      hnsw_sindi: 26.2,
      uhg: 25.95,
      fhg: 23.05,
    },
    msmarco: {
      hnsw_sindi: 44.68,
      uhg: 43.72,
      fhg: 39.18,
    },
    fever: {
      hnsw_sindi: 28.89,
      uhg: 28.67,
      fhg: 24.75,
    },
    "dbpedia-entity": {
      hnsw_sindi: 23.45,
      uhg: 23.24,
      fhg: 20.54,
    },
  },
  timeTicks: [0, 10000, 20000, 30000, 40000, 50000],
  sizeTicks: [0, 10, 20, 30, 40, 50],
};

const SVG_NS = "http://www.w3.org/2000/svg";

function node(name, attrs = {}, text = null) {
  const element = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) {
    element.setAttribute(key, value);
  }
  if (text !== null) {
    element.textContent = text;
  }
  return element;
}

function formatTime(value) {
  return Math.round(value).toLocaleString("en-US");
}

function formatSize(value) {
  return value.toFixed(2).replace(/\.00$/, "");
}

function drawLegend(svg, width) {
  const y = 51;
  const labelWidths = { hnsw_sindi: 92, fhg: 40, uhg: 42 };
  const gap = 33;
  const itemWidths = DATA.methods.map((method) => 23 + labelWidths[method]);
  const totalWidth = itemWidths.reduce((sum, value) => sum + value, 0) +
    gap * (DATA.methods.length - 1);
  let x = width / 2 - totalWidth / 2;

  DATA.methods.forEach((method, index) => {
    svg.appendChild(node("rect", {
      x,
      y: y - 11,
      width: 16,
      height: 11,
      fill: DATA.colors[method],
      rx: 1.5,
    }));
    svg.appendChild(node("text", {
      x: x + 23,
      y,
      class: "legend",
    }, DATA.methodLabels[method]));
    x += itemWidths[index] + gap;
  });
}

function drawMetricPanel(svg, options) {
  const plotLeft = options.panelX + 78;
  const plotRight = options.panelX + options.panelWidth - 18;
  const plotTop = options.panelY + 15;
  const plotHeight = 295;
  const plotBottom = plotTop + plotHeight;
  const maxValue = options.ticks[options.ticks.length - 1];
  const groupWidth = (plotRight - plotLeft) / DATA.datasets.length;
  const barWidth = Math.min(31, groupWidth * 0.21);
  const barGap = Math.min(5, groupWidth * 0.055);
  const barsWidth = DATA.methods.length * barWidth +
    (DATA.methods.length - 1) * barGap;

  svg.appendChild(node("line", {
    x1: plotLeft,
    y1: plotBottom,
    x2: plotRight,
    y2: plotBottom,
    class: "axis-line",
  }));
  svg.appendChild(node("line", {
    x1: plotLeft,
    y1: plotTop,
    x2: plotLeft,
    y2: plotBottom,
    class: "axis-line",
  }));

  options.ticks.forEach((tick) => {
    const y = plotBottom - (tick / maxValue) * plotHeight;
    if (tick !== 0) {
      svg.appendChild(node("line", {
        x1: plotLeft,
        y1: y,
        x2: plotRight,
        y2: y,
        class: "grid-line",
      }));
    }
    svg.appendChild(node("line", {
      x1: plotLeft,
      y1: y,
      x2: plotLeft - 4,
      y2: y,
      class: "axis-line",
    }));
    svg.appendChild(node("text", {
      x: plotLeft - 9,
      y: y + 4,
      "text-anchor": "end",
      class: "tick",
    }, tick.toLocaleString("en-US")));
  });

  svg.appendChild(node("text", {
    x: options.panelX + 18,
    y: plotTop + plotHeight / 2,
    transform: `rotate(-90 ${options.panelX + 18} ${plotTop + plotHeight / 2})`,
    "text-anchor": "middle",
    class: "axis-title",
  }, options.yLabel));

  DATA.datasets.forEach((dataset, datasetIndex) => {
    const groupCenter = plotLeft + groupWidth * (datasetIndex + 0.5);
    const groupStart = groupCenter - barsWidth / 2;

    DATA.methods.forEach((method, methodIndex) => {
      const value = options.values[dataset][method];
      const x = groupStart + methodIndex * (barWidth + barGap);
      const barHeight = (value / maxValue) * plotHeight;
      const y = plotBottom - barHeight;
      const bar = node("rect", {
        x,
        y,
        width: barWidth,
        height: barHeight,
        fill: DATA.colors[method],
        rx: 1.5,
      });
      bar.appendChild(node("title", {},
        `${DATA.datasetLabels[dataset]} · ${DATA.methodLabels[method]} · ${options.tooltipLabel}: ${options.formatter(value)}`));
      svg.appendChild(bar);
      svg.appendChild(node("text", {
        x: x + barWidth / 2,
        y: y - 5,
        "text-anchor": "middle",
        class: "value-label",
      }, options.formatter(value)));
    });

    svg.appendChild(node("text", {
      x: groupCenter,
      y: plotBottom + 22,
      "text-anchor": "middle",
      class: "x-label",
    }, DATA.datasetLabels[dataset]));
  });

  svg.appendChild(node("text", {
    x: (plotLeft + plotRight) / 2,
    y: plotBottom + 55,
    "text-anchor": "middle",
    class: "panel-label",
  }, options.panelLabel));
}

function draw() {
  const svg = document.getElementById("figure");
  const width = 1180;
  const height = 470;
  const panelY = 80;
  const panelWidth = 565;
  const panelHeight = 375;
  const panelGap = 20;
  const startX = (width - 2 * panelWidth - panelGap) / 2;

  svg.replaceChildren();

  const defs = node("defs");
  const style = node("style");
  style.textContent = `
    .axis-line { stroke: #111111; stroke-width: 1; shape-rendering: crispEdges; }
    .grid-line { stroke: #c7c7c7; stroke-width: 0.75; stroke-dasharray: 2 2; }
    .legend { font: 19px "Times New Roman", Times, serif; fill: #111111; }
    .tick { font: 11px "Times New Roman", Times, serif; fill: #111111; }
    .axis-title { font: 19px "Times New Roman", Times, serif; fill: #111111; }
    .x-label { font: 14px "Times New Roman", Times, serif; fill: #111111; }
    .panel-label { font: 20px "Times New Roman", Times, serif; font-weight: 700; fill: #111111; }
    .value-label { font: 8px "Times New Roman", Times, serif; font-weight: 700; fill: #111111; }
  `;
  defs.appendChild(style);
  svg.appendChild(defs);

  svg.appendChild(node("title", { id: "figure-title" }, "Construction Time and Index Size"));
  svg.appendChild(node("desc", { id: "figure-desc" }, "Separate grouped bar charts comparing construction time and index size for HNSW+SINDI, UHG, and FHG on NQ, HotpotQA, MS MARCO, FEVER, and DBpedia-Entity."));
  svg.appendChild(node("rect", { x: 0, y: 0, width, height, fill: "#ffffff" }));

  drawLegend(svg, width);

  drawMetricPanel(svg, {
    panelX: startX,
    panelY,
    panelWidth,
    panelHeight,
    values: DATA.time,
    ticks: DATA.timeTicks,
    yLabel: "Construction Time (s)",
    tooltipLabel: "time",
    formatter: formatTime,
    panelLabel: "(a) Construction Time",
  });
  drawMetricPanel(svg, {
    panelX: startX + panelWidth + panelGap,
    panelY,
    panelWidth,
    panelHeight,
    values: DATA.size,
    ticks: DATA.sizeTicks,
    yLabel: "Index Size (GiB)",
    tooltipLabel: "size",
    formatter: formatSize,
    panelLabel: "(b) Index Size",
  });
}

function downloadSvg() {
  const svg = document.getElementById("figure");
  const source = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "construction_time_size_fig9.svg";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

draw();
</script>
</body>
</html>
